  spring:
    application:
      name: dryforest_app

    datasource:
      url: jdbc:postgresql://localhost:5432/dryforest_app
      username: postgres
      password: florentino
      driver-class-name: org.postgresql.Driver

    jpa:
      defer-datasource-initialization: true
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

    sql:
      init:
        mode: never # always
        separator: "@@"
        schema-locations:
          - classpath:data.sql
          - classpath:views.sql

    flyway:
      enabled: false

  server:
    port: 8081

  sync:
    pullable-tables:
      patrol:
        - patrol_groups
        - incident_types
        - observation_types
        - categories
        - animals

      reforestation:
        - persons
        - species_types
        - species
        - severities
        - zone_types
        - patrol_groups
        - categories
        - animals
